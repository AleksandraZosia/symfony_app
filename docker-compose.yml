services:
    web-app:
        build:
            context: .
        container_name: symfony_app
        volumes:
            - .:/var/www/html
        depends_on:
            - db
        networks:
            - symfony

    nginx:
        image: nginx:latest
        container_name: symfony_nginx
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - web-app
        networks:
            - symfony

    db:
        image: postgres:16
        container_name: symfony_db
        restart: always
        environment:
            POSTGRES_DB: app_db
            POSTGRES_USER: app_db
            POSTGRES_PASSWORD: secret
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app_db"]
            timeout: 5s
            retries: 5
            interval: 5s
        volumes:
            - postgres_data:/var/lib/postgresql/data:rw
        networks:
            - symfony

volumes:
    postgres_data:

networks:
    symfony:
